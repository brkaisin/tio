<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TIO: a functional effect system for TypeScript</title>
        <meta name="description" content="{{description}}" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        />
        <link rel="stylesheet" href="style.css?v={{styleHash}}" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f46e5'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='white'>TIO</text></svg>"
        />
        <script>
            try {
                const theme = localStorage.getItem("theme");
                if (theme) document.documentElement.dataset.theme = theme;
            } catch (e) {}
        </script>
    </head>
    <body>
        <header class="topbar">
            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <a class="brand" href="#introduction"><span class="logo">TIO</span></a>
            <span class="version">v{{version}}</span>
            <span class="tagline">{{description}}</span>
            <div class="topbar-actions">
                <button class="theme-toggle" aria-label="Toggle dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" />
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.5" fill="currentColor" />
                        <path
                            d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
                <a class="github" href="{{repository}}" target="_blank" rel="noopener" aria-label="GitHub repository">
                    <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
                        <path
                            fill="currentColor"
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                        />
                    </svg>
                </a>
            </div>
        </header>
        <div class="layout">
            <nav class="sidebar">
                <ul class="toc">
                    {{sidebar}}
                </ul>
            </nav>
            <main class="content">
                {{content}}
                <footer>
                    TIO is released under the <a href="{{repository}}/blob/master/LICENSE.txt">MIT license</a>.
                    <a href="{{repository}}">Contribute on GitHub</a>.
                </footer>
            </main>
        </div>
        <script src="script.js?v={{scriptHash}}"></script>
    </body>
</html>
